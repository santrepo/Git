---
 - hosts: local
   connection: local
    tasks:
     - name: Creation of ec2 instances
       amazon.aws.ec2_instance:
        - name: "{{ item.name }}"
          key_name: "instance1sshkey"
          instance_type: t3.micro
          security_group: default
          region: ap-south-1
          aws_access_key: "{{ec2_access_key}}"
          aws_secret_key: "{{ec2_secret_key}}"
          network:
           assign_public_ip: true
          image_id: "{{ item.image }}"
      loop:
        - { image: "ami-019715e0d74f695be", name: "worker-node1" }
        - { image: "ami-0ffef61f6dc37ae89", name: "worker-node2" }
        - { image: "ami-0ffef61f6dc37ae89", name: "worker-node3" }